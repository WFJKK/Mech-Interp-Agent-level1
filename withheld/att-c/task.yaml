# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene
# check looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
task: >
  The network was trained to output the largest of its four tokens (max of 4), on inputs of exactly four tokens and on
  nothing else: Gross et al.'s one-layer, one-head, attention-only transformer, taken from the proof
  pipeline's zoo (attn-max4, 64 tokens, width 32). Inputs of one to three tokens are outside what it was trained on;
  it still gives an output there, read at the last token given.
provenance:
  taken_from: Compact-Proof-Agent, models/attn-max4/zoo, setting v64, seeds 0 and 1 (12 November 2026); the
    weights renamed (E embed, P pos, WQ query, WK key, WV value, WO out, U unembed) and embed given one
    more row, all zeros, for an empty slot
  recipe: the proof pipeline's recipe for Gross et al.'s attention networks (models/attn-max4/config.yaml and
    core/train.py), in torch and float32; 4 tokens of 0..63 per input, uniformly random, a fresh batch of 512 at
    every step; label the largest token; cross-entropy at the last position; AdamW lr 0.001, weight decay
    0.01; 4,000 steps; d_model = d_head = 32; no biases; initial weights uniform in +-1/sqrt(shape[0])
  networks:
    att-c-s0: {from: "Compact-Proof-Agent models/attn-max4/zoo/attn-max4-v64-s0.npz", source_sha256: 14df6bfa2125891da31c87dbf32543382ad3532750eb6fbe9d5f0e45d37f69ee, proof_pipeline_split: dev,
      right_on_every_training_input_float64: 0.99992275, float32_torch_record: 0.99992275, inputs_where_they_differ: 0}
    att-c-s1: {from: "Compact-Proof-Agent models/attn-max4/zoo/attn-max4-v64-s1.npz", source_sha256: 2a6375f85af256a45b3d9b5fe6fe9495807d5fc50297f49497b5a5ff255ba646, proof_pipeline_split: held_out,
      right_on_every_training_input_float64: 0.99996388, float32_torch_record: 0.99996388, inputs_where_they_differ: 0}
  architecture: one layer, one attention head, attention only (no MLP, no layer norm, no biases), learned
    positional embeddings, read at the last position; models/att-c/model.py reads an input of fewer tokens
    at its last token given, attending over the tokens given, which is what a causal transformer computes
    there (the proof pipeline's module reads only at its last position)
  how_often_the_output_is_the_largest_token:   # every input of one to three tokens; four: the zoo record above
    att-c-s0: {1: "58 of 64", 2: "4,044 of 4,096", 3: "43,856 of 262,144", 4: 0.99992}
    att-c-s1: {1: "60 of 64", 2: "3,015 of 4,096", 3: "257,387 of 262,144", 4: 0.99996}
hygiene:
  - max4
  - max-of
  - max of
  - largest
  - larger
  - greater of
  - bigger of
  - Gross
  - compact proof
  - four tokens
  - 4 tokens
  - exactly four
  - trained on
