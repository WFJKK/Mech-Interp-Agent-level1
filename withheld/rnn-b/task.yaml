# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene
# check looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
task: >
  The network was trained to output the position of the second-largest of its three numbers (2nd argmax,
  x.argsort()[-2]); with three numbers that is the position of the median.
  It was trained on inputs drawn exactly as the data set says, fresh at every step, so the data set is what it
  was trained on. It is one of the networks of ARC's AlgZoo, which trains networks this small on algorithmic
  tasks and publishes them uninterpreted, as a challenge to explain them; AlgZoo's own chart puts this size at
  98.5% (its best of five seeds, seed 0;
  measured here 98.43%, on another sample and in float64).
provenance:
  source: ARC's AlgZoo, github.com/alignment-research-center/alg-zoo (commit 4433f50, licence MIT-0); the weights
    from its public folder gs://arc-ml-public/alg/zoo, fetched on 12 November 2026
  files: withheld/rnn/pth/2nd_argmax_4_3_1073741824_<seed>.pth, one per network
  converted_by: withheld/rnn/convert.py (input = rnn.weight_ih_l0, recurrent = rnn.weight_hh_l0, readout = linear.weight;
    float32 as published; read without torch, by an unpickler that runs nothing)
  recipe: alg_zoo/training.py, train("2nd_argmax", hidden_size=4, seq_len=3, seed=seed); every step 1,024 inputs of
    th.randn, labelled x.argsort(-1)[..., -2]; cross-entropy; AdamW, lr 0.04 / sqrt(4), weight decay 0.001, the rate
    warmed up over 2^14 steps and then decayed exponentially to 0.01 of it; 2^30 inputs in all (2^20 steps);
    PyTorch's default initialization (every matrix uniform in +-1/sqrt(4)), which models/rnn-e holds; float32
  sha256:
    rnn-b-s0: e1003b62cdbdf671ee7ef875ed7aea3a410684681b6e0659fd0738a5d0e014e7
    rnn-b-s1: 540ca26c0dbaa681453e3c437c2e321a4fe0c97f4a9ccdf8703bd98b9cd0ca56
