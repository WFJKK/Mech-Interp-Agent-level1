# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene
# check looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
task: >
  The network was trained to output the position of the second-largest of its two numbers (2nd argmax,
  x.argsort()[-2]); with two numbers that is the position of the smaller one. It was trained on inputs drawn
  exactly as the data set says, fresh at every step, so the data set is what it was trained on. It is one of
  the networks of ARC's AlgZoo, which trains networks this small on algorithmic tasks and publishes them
  uninterpreted, as a challenge to explain them; AlgZoo's own chart puts this size at 100.0% (its best of five
  seeds, seed 2).
provenance:
  source: ARC's AlgZoo, github.com/alignment-research-center/alg-zoo (commit 4433f50, licence MIT-0); the weights
    from its public folder gs://arc-ml-public/alg/zoo, fetched on 12 November 2026
  files: withheld/rnn/pth/2nd_argmax_2_2_1073741824_<seed>.pth, one per network
  converted_by: withheld/rnn/convert.py (input = rnn.weight_ih_l0, recurrent = rnn.weight_hh_l0, readout = linear.weight;
    float32 as published; read without torch, by an unpickler that runs nothing)
  recipe: alg_zoo/training.py, train("2nd_argmax", hidden_size=2, seq_len=2, seed=seed); every step 1,024 inputs of
    th.randn, labelled x.argsort(-1)[..., -2]; cross-entropy; AdamW, lr 0.04 / sqrt(2), weight decay 0.001, the rate
    warmed up over 2^14 steps and then decayed exponentially to 0.01 of it; 2^30 inputs in all (2^20 steps);
    PyTorch's default initialization (every matrix uniform in +-1/sqrt(2)), which models/rnn-d holds; float32
  sha256:
    rnn-a-s0: 797df8bf9f6589d3d9a813dabc41d6c9024c7116aee696bd0ec3c6316d7ee297
    rnn-a-s1: 8ebb08f6690e486ee08fb6439c673ae6aa0a4360e5d2411d3beb47e59fd81b3f
    rnn-a-s2: 7d5bab82800560f24ad3f8293128abab013a749c7ef46d4e395e684b8703cea9
    rnn-a-s3: 5e09b019faa8ac4ebfebb53aa76ad85f3a1bf233c18692fbaab8e4d19871fba8
    rnn-a-s4: a05cdb8a5dd134d765463ce90da8c2ae66052a59dab50ddeaacdc4c246745421
how_often_the_output_is_the_second_largest:   # on 2^20 inputs, numpy.random.default_rng(0).standard_normal, in float64
  rnn-a-s0: 0.4997    # it answers 0 on every input: this seed learned nothing
  rnn-a-s1: 0.99989
  rnn-a-s2: 0.99991
  rnn-a-s3: 0.87461
  rnn-a-s4: 0.4997    # it answers 0 on every input
roles: s2 (AlgZoo's own pick, the best of five) for the rounds, s1 (the next best) for the seed check; s3, s0 and s4 for
  checking an entry again later (s0 and s4 learned nothing)
