# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene
# check looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
task: >
  Untrained. The networks were never trained: each is the state AlgZoo's trainer starts from for one seed of
  rnn-a's networks (2nd argmax, hidden size 2, two numbers), saved by AlgZoo before its first step (0 training
  sequences) and converted as published. A model for the baseline of the shape it shares with rnn-a: a run on
  it is a usual run in everything the agent is given (the same prompt, sizes, data set, rounds, budgets and
  reward), with nothing learned to find, so what the agent achieves here is generic. Its networks behave like
  none of the trained ones, and their outputs are lopsided (how_often_each_output); whatever regularity a run
  finds in one of them is an accident of that network, which its other networks show up.
baseline_of: [rnn-a]
initialization:
  how: PyTorch's default, set by AlgZoo's trainer (alg_zoo/training.py, train) under torch.manual_seed(seed) and saved
    before the first step as 2nd_argmax_2_2_0_<seed>.pth; every matrix uniform in +-1/sqrt(2) (nn.RNN's reset_parameters,
    and nn.Linear's kaiming_uniform with a = sqrt(5), whose bound is the same here); float32
  converted_by: withheld/rnn/convert.py, from withheld/rnn/pth
  networks:   # in the order of config.yaml
    rnn-d-s2: {seed: 2, start_of: rnn-a-s2, file: 2nd_argmax_2_2_0_2.pth, sha256: 473a5adac20e9edbec798c4fae98e3c0b9681d4e49f81e9d618ac2cba11930fd}
    rnn-d-s1: {seed: 1, start_of: rnn-a-s1, file: 2nd_argmax_2_2_0_1.pth, sha256: d5792dc7a2cbfb419f11e7e0482495613cffe0bd2623a84c57ef6b51109ec95b}
    rnn-d-s0: {seed: 0, start_of: rnn-a-s0, file: 2nd_argmax_2_2_0_0.pth, sha256: d12536364b68bae0878f9784833a66b07fb3740a8dd90ce18323e49b57c50d4f}
    rnn-d-s3: {seed: 3, start_of: rnn-a-s3, file: 2nd_argmax_2_2_0_3.pth, sha256: ef7dc3043281120fc305e3df90920ad973c115a3338b77ba0a452f16ed2203c3}
    rnn-d-s4: {seed: 4, start_of: rnn-a-s4, file: 2nd_argmax_2_2_0_4.pth, sha256: f46d267eb64071eabf7de5046cfaffc33edf549075297ddb239b8f4f3b94461f}
  roles: config.yaml lists first the starting points of the networks rnn-a's pilot uses, in the order the baseline
    uses them, rnn-d-s2 for the rounds (where rnn-a-s2 started) and rnn-d-s1 for the seed check (where
    rnn-a-s1 started); the other three are for freezing. Training moved every network far from its start (the
    distance is several times the start's own size, matrix by matrix), so a trained network and its start share little.
how_often_each_output:   # on 2^20 inputs, numpy.random.default_rng(0).standard_normal, in float64; one share per output
  rnn-d-s2: [0.493, 0.507]
  rnn-d-s1: [0.545, 0.455]
  rnn-d-s0: [1.0, 0.0]
  rnn-d-s3: [0.96, 0.04]
  rnn-d-s4: [1.0, 0.0]
how_often_the_output_is_the_second_largest:   # the same inputs: what rnn-a's networks were trained to give
  rnn-d-s2: 0.2758
  rnn-d-s1: 0.2513
  rnn-d-s0: 0.4997
  rnn-d-s3: 0.479
  rnn-d-s4: 0.4997
hygiene:
  - untrained
  - not trained
  - never trained
  - before training
  - random weights
  - randomly initialized
  - randomly initialised
  - random init
  - initialization
  - initialisation
  - baseline
  - 2nd argmax
  - second argmax
  - 2nd_argmax
  - 2nd-argmax
  - second-largest
  - second largest
  - second biggest
  - second highest
  - second-highest
  - runner-up
  - runner up
  - next largest
  - largest
  - larger
  - biggest
  - bigger
  - smaller
  - smallest
  - lowest
  - lesser
  - median
  - middle
  - AlgZoo
  - alg-zoo
  - alg_zoo
  - Alignment Research
  - alignment.org
  - arc-ml
  - Gross
  - compact proof
  - trained on
