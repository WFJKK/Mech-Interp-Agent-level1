# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene
# check looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
task: >
  The network was trained to output the largest of its four tokens (max of 4), on inputs of exactly four
  tokens and on nothing else. Inputs of one to three and of five to eight tokens are outside what it was
  trained on; it still gives an output there, because it only adds up one embedding column per token.
provenance:
  trained_by: withheld/lin-b/train.py, 11 November 2026 (the proof pipeline's linear network and training
    recipe, models/max2/model.py and core/train.py of Compact-Proof-Agent, written in numpy)
  recipe: 4 tokens of 0..63 per input, uniformly random, fresh at every step; label the largest token;
    cross-entropy; AdamW lr 0.001, betas 0.9 and 0.999, eps 1e-8, weight decay 0.01; batch 1,024; width 8;
    initial weights uniform in +-1/sqrt(fan_in); float32
  how_long: in blocks of 10,000 steps until the share of all 64^4 four-token inputs on which the output is the
    largest token gains less than 0.05 percentage points over 20,000 steps (Joshua, 11 November 2026, "until
    the loss is acceptable or the performance"); the max-2 recipe's 4,000 steps leave such a network at 97.2%
  networks:
    lin-b-s0: {seed: 0, steps: 80000, final_loss: 0.0092, largest_on_all_four_token_inputs: 0.99830}
    lin-b-s1: {seed: 1, steps: 70000, final_loss: 0.0107, largest_on_all_four_token_inputs: 0.99785}
  training_curve:   # step, mean loss over the block, share of all four-token inputs answered with the largest
    lin-b-s0: [[10000, 0.348, 0.99026], [20000, 0.031, 0.99508], [30000, 0.018, 0.99692], [40000, 0.014, 0.99764],
               [50000, 0.012, 0.99775], [60000, 0.011, 0.99818], [70000, 0.010, 0.99839], [80000, 0.009, 0.99830]]
    lin-b-s1: [[10000, 0.330, 0.99097], [20000, 0.031, 0.99497], [30000, 0.019, 0.99643], [40000, 0.015, 0.99706],
               [50000, 0.013, 0.99737], [60000, 0.012, 0.99759], [70000, 0.011, 0.99785]]
  how_often_the_output_is_the_largest_token:   # 1 to 3 tokens: every input; 5 to 8 tokens: a sample of 1,000,000
    lin-b-s0: {1: "52 of 64", 2: "3,984 of 4,096", 3: "260,989 of 262,144", 4: 0.9983, 5: 0.9895, 6: 0.9662, 7: 0.9320, 8: 0.8918}
    lin-b-s1: {1: "51 of 64", 2: "3,959 of 4,096", 3: "260,685 of 262,144", 4: 0.9979, 5: 0.9899, 6: 0.9694, 7: 0.9396, 8: 0.9045}
