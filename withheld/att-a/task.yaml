# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene
# check looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
task: >
  The network was trained to output the largest of its two tokens (max of 2), on inputs of exactly two tokens and on
  nothing else: Gross et al.'s one-layer, one-head, attention-only transformer, taken from the proof
  pipeline's zoo (attn-max2, 64 tokens, width 32). Inputs of one token are outside what it was trained on;
  it still gives an output there, read at the last token given.
provenance:
  taken_from: Compact-Proof-Agent, models/attn-max2/zoo, setting v64, seeds 0 and 1 (12 November 2026); the
    weights renamed (E embed, P pos, WQ query, WK key, WV value, WO out, U unembed) and embed given one
    more row, all zeros, for an empty slot
  recipe: the proof pipeline's recipe for Gross et al.'s attention networks (models/attn-max2/config.yaml and
    core/train.py), in torch and float32; 2 tokens of 0..63 per input, uniformly random, a fresh batch of 512 at
    every step; label the largest token; cross-entropy at the last position; AdamW lr 0.001, weight decay
    0.01; 4,000 steps; d_model = d_head = 32; no biases; initial weights uniform in +-1/sqrt(shape[0])
  networks:
    att-a-s0: {from: "Compact-Proof-Agent models/attn-max2/zoo/attn-max2-v64-s0.npz", source_sha256: 60c6671e3a6e76ab2fd6ab2ce14be2d0938ce2bbc3ac3db07aa987d002ea4a39, proof_pipeline_split: dev,
      right_on_every_training_input_float64: 1.0, float32_torch_record: 1.0, inputs_where_they_differ: 0}
    att-a-s1: {from: "Compact-Proof-Agent models/attn-max2/zoo/attn-max2-v64-s1.npz", source_sha256: 037e0689e7a9e43ea385e590a7197d31938c1819ef0c5f732d5f33645ae2c34c, proof_pipeline_split: held_out,
      right_on_every_training_input_float64: 1.0, float32_torch_record: 1.0, inputs_where_they_differ: 0}
  architecture: one layer, one attention head, attention only (no MLP, no layer norm, no biases), learned
    positional embeddings, read at the last position; models/att-a/model.py reads an input of fewer tokens
    at its last token given, attending over the tokens given, which is what a causal transformer computes
    there (the proof pipeline's module reads only at its last position)
  how_often_the_output_is_the_largest_token:   # every input of one to three tokens; four: the zoo record above
    att-a-s0: {1: "64 of 64", 2: "4,096 of 4,096"}
    att-a-s1: {1: "64 of 64", 2: "4,096 of 4,096"}
hygiene:
  - max2
  - max-of
  - max of
  - largest
  - larger
  - greater of
  - bigger of
  - Gross
  - compact proof
  - pairs
  - two tokens
  - 2 tokens
  - exactly two
  - trained on
