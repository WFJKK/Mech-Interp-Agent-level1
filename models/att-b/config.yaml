# The model att-b: a transformer with one layer and one attention head, asked about inputs that fill one of its 2 slots or both.
# Sizes, the data set and the networks; change values here, never in code.
# What the networks were trained to do, and on which inputs, is not in this folder. It is in
# withheld/att-b/, which no tool of the agent reaches, and nothing here may say it (the hygiene check reads
# this folder's agent-facing files).
name: att-b
sizes:
  n_ctx: 2        # slots per input; a slot holds a token or is empty
  d_vocab: 64     # tokens are whole numbers 0 .. d_vocab - 1; the output is one of them too
  d_model: 32
  d_head: 32
input_space: [65, 65]   # per slot: a token 0 .. 63, or 64 for an empty slot
n_outputs: 64
# The data set: inputs are drawn, not listed (level1/lang.py, data sets). The verifier samples it.
data_set:
  kind: lengths
  lengths: [1, 2]   # the number of tokens, each as likely as the other
  vocab: 64               # then that many tokens, each below this and equally likely
  empty: 64               # what the remaining slots hold
  says: >
    An input is drawn like this. First a number of tokens is picked, 1 or 2, each equally likely.
    Then that many tokens are picked, each a whole number from 0 to 63 and equally likely. The tokens
    fill the first slots and a remaining slot is empty (64). The data set is every input that can be
    drawn this way, each counted as often as it is drawn: 4,160 different inputs, 64 with one token
    and 4,096 with two, yet each number of tokens makes up half of the data set.
weights:                # as stored in the zoo and as the agent sees them: name and shape
  embed: [65, 32]       # its last row, the empty slot's, is all zeros
  pos: [2, 32]
  query: [32, 32]
  key: [32, 32]
  value: [32, 32]
  out: [32, 32]
  unembed: [32, 64]
# Two networks of the same sizes and training, with different seeds. A run works on one and checks its
# locked entry on another.
networks:
  - id: att-b-s0
    weights: zoo/att-b-s0.npz
    sha256: a7a75fb27248fca6792837b112a1a2bd7167df63afb3d4836134b248b6549506
  - id: att-b-s1
    weights: zoo/att-b-s1.npz
    sha256: 798c369c72468e3a8d2e179fcdb86d583c6e7278f8cc28efb33fd55ad3bce9e9
