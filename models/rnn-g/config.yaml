# The model rnn-g: a recurrent network with one layer of 16 units, a ReLU and no biases, reading ten
# real numbers. Its networks are published ones, converted by withheld/rnn/convert.py.
# Sizes, the data set and the networks; change values here, never in code.
# What the networks were trained to do is not in this folder. It is in withheld/rnn-g/, which no tool
# of the agent reaches, and nothing here may say it (the hygiene check reads this folder's agent-facing files).
name: rnn-g
sizes:
  n_ctx: 10      # numbers per input
  d_hidden: 16   # units of the recurrent layer
input_space: [real, real, real, real, real, real, real, real, real, real]   # per position: a real number
n_outputs: 10
# The data set: inputs are drawn, not listed (level1/lang.py, data sets). The verifier samples it.
data_set:
  kind: normal          # every number drawn on its own from the standard normal distribution
  says: >
    An input is ten real numbers, x_0 to x_9, each drawn on its own from the standard normal
    distribution (mean 0, standard deviation 1). The data set is every input that can be drawn this
    way, each weighted by how likely it is to be drawn. There are infinitely many, so the verifier
    scores a sample.
weights:                # as stored in the zoo and as the agent sees them: name and shape
  input: [16, 1]
  recurrent: [16, 16]
  readout: [10, 16]
# Two networks of the same sizes. A run works on the first and checks its locked entry on the second.
networks:
  - id: rnn-g-s0
    weights: zoo/rnn-g-s0.npz
    sha256: 93ec78ef68b5ca1af97fcea09195e672011d451502db6f18456d6812f4a1bc8c
  - id: rnn-g-s1
    weights: zoo/rnn-g-s1.npz
    sha256: bd41ad4fe3a0c949f02dfe924b8f40c497f8e7dd44074d635b0d69b81744cc35
