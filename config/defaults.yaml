# Defaults of every run. A run config names a model and its networks and overrides what it needs.
# Numbers live here and in the run configs, never in code.

runs_dir: ~/mech-interp-level1-runs   # run folders live outside the repository
run_id: null                          # a run config sets it; the run folder is <runs_dir>/<run_id>

# who answers a round (docs/DESIGN.md, section 6)
backend: claude_code                  # claude_code: the Claude Code CLI; fake: scripted
auth: login                           # who pays: login, the CLI's own login (a subscription is not billed per
                                      # call); api_key, the key in api_key_env, billed per token, within budget
api_key_env: CPL_ANTHROPIC_KEY        # never ANTHROPIC_API_KEY: the backend removes that from the CLI's environment
api_workspace_env: CPL_ANTHROPIC_WORKSPACE  # a workspace ID (wrkspc_...), for a key not scoped to one; unset: none sent
budget:                               # api_key: dollars, by Claude Code's own count (level1/budget.py)
  run_usd: 60                         # the rounds end when the run has spent this; resume --budget-usd changes it
  round_usd: 20                       # a round ends when it has spent this; what it submitted stands
agent_model: claude-fable-5-1
effort: high                          # low, medium, high, xhigh, max; null leaves it to the CLI
claude_code_command: claude
python_executable: null               # the Python that serves the tools; null: the one running the loop
api_retries: {tries: 12, first_wait_s: 60, max_wait_s: 1800}
max_consecutive_refusals: 2

# the rounds
prompt_template: round_v1
rounds_max: 5
patience: 2                           # stop after this many rounds in a row that did not raise the best reward

# one session (one round)
session:
  python_calls: 40
  submissions: 4
  max_turns: 150
  seconds: 5400                       # wall clock; when it runs out, what the session submitted stands

# one run_python call
python:
  time_limit_s: 300
  memory_limit_mb: 4096
  max_result_mb: 8
  threads: 2

# where the agent's code runs (level1/sandbox.py): auto, hardened, container, landlock or process
sandbox: auto
sandbox_image: mech-interp-level1-sandbox:1
sandbox_dir: null

# the verifier
verifier:
  check: auto                         # all: every input of the data set; sample: a fresh sample per scoring;
                                      # auto: all if the data set can be listed and is small enough, else sample
  enumerate_up_to: 200000             # auto checks every input of a data set up to this size
  sample_size: 4000                   # inputs per scoring when it samples
  reference_samples: 8                # when it samples, the report scores each reference entry on this many
                                      # fixed samples and gives the mean
  time_limit_s: 120                   # per entry

# what an entry may hold
entry:
  max_nodes: 400
  max_const_scalars: 256              # numbers written into the entry; a table of a network's outputs does not fit

# the reward (level1/rewards.py); the parts are kept, so a run can be scored again under another one.
# A config that names another reward replaces this block whole; one that keeps the name changes parameters.
reward:
  name: r_alpha
  alpha: 10                           # one wrong answer is priced at this many forward passes

# strings nothing the agent can reach may contain, besides the model's own list (withheld/<model>/task.yaml)
hygiene: ["Gross", "compact proof", "Compact-Proof"]

# after the rounds: the best entry, locked, is run unchanged on this network (a run config names it)
seed_check: {network: null}
