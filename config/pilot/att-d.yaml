# The pilot on att-d: a second transformer of the same design and sizes as att-c, asked about inputs that fill from one to all of its 4 slots
# (models/att-d: 4 slots, 64 tokens, width 32), 12,987 operations per forward pass. The agent is told what an input is and how the data set is
# drawn. It is not told which inputs the network was trained on, or to do what; finding where its behaviour
# can be described is the work.
# About 17 million inputs, so the verifier scores a fresh sample for every submission.
#   rounds on      att-d-s0
#   seed check on  att-d-s1   the same sizes and training, another seed
# Everything else is config/pilot/base.yaml and config/defaults.yaml.
extends: base.yaml
run_id: pilot-att-d
model: models/att-d
network: att-d-s0
seed_check: {network: att-d-s1}
verifier:
  check: sample
  sample_size: 16384      # per scoring; an entry's build is spread over these
