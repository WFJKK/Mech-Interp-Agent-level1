# The pilot on a second network: lin-b, of the same design as lin-a but trained afresh, asked about inputs of 1
# to 8 tokens (models/lin-b: 8 slots, 64 tokens, width 8), 703 operations per forward pass. The agent is told
# what an input is and how the data set is drawn. It is not told which inputs the network was trained on, or
# to do what; finding where its behaviour can be described is the work.
# About 2.8 x 10^14 inputs: too many for anyone to check them all, so the verifier scores a fresh sample for
# every submission.
#   rounds on      lin-b-s0
#   seed check on  lin-b-s1   the same sizes and training, another seed
# Everything else is config/pilot/base.yaml and config/defaults.yaml.
extends: base.yaml
run_id: pilot-lin-b
model: models/lin-b
network: lin-b-s0
seed_check: {network: lin-b-s1}
verifier:
  check: sample
  sample_size: 16384      # per scoring; an entry's build is spread over these
