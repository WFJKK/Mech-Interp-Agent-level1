# The level-1 pilot, without its model: what every pilot run shares. Not a run by itself. A run is a file
# next to this one that extends it and names a model, one network of it and a second network for the seed
# check:
#   config/pilot/lin-a.yaml         the linear network on pairs of tokens, 64 tokens, width 8
#   config/pilot/lin-a-1to4.yaml    the same network asked about inputs of 1 to 4 tokens
#   config/pilot/lin-b.yaml         a network of the same design trained afresh, asked about 1 to 8 tokens
#   config/pilot/lin-c.yaml         lin-a's design trained afresh on another task, 4 slots
#   config/pilot/lin-d.yaml         lin-b's design trained afresh on another task, 8 slots
#   config/pilot/att-a.yaml         a transformer, one layer and one head, 64 tokens, width 32, 2 slots
#   config/pilot/att-b.yaml         another transformer of att-a's design and sizes
#   config/pilot/att-c.yaml         a transformer of the same design with 4 slots
#   config/pilot/att-d.yaml         another transformer of att-c's design and sizes
#   config/pilot/lin-e.yaml         the baseline of lin-c's shape (and lin-a-1to4's)
#   config/pilot/lin-f.yaml         the baseline of lin-d's shape (and lin-b's)
#   config/pilot/att-e.yaml         the baseline of att-c's shape (and att-d's)
#
# A run has two parts (docs/DESIGN.md):
#   1. the rounds: the agent explores one network and submits entries; the score is the reward;
#   2. the seed check: the best entry, locked, is run unchanged on a second network. No agent takes part.
backend: claude_code
agent_model: claude-fable-5-1
effort: high
rounds_max: 5
patience: 2
sandbox: auto     # hardened once Docker or Landlock is available; run.json records the mode
