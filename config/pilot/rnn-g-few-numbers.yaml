# The single agent on ARC's 432-weight challenge network again (models/rnn-g, rnn-g-s0), going on from its own nine
# rounds (pilot-rnn-g, pilot-rnn-g-detail, pilot-rnn-g-detail-2), now with room for only 64 numbers in an entry's
# constants instead of 512. Its locked entry held 338 numbers, almost all of them tables fitted to the network's
# sampled outputs; with 64 there is room for its exact computation of the network and a few thresholds, and for no
# such table. What an entry needs beyond that it has to compute from the weights, where the work is counted. The
# earlier entries over the limit stay in `entries` to read (docs/CONTINUATION.md, "With less room").
#
# The price is alpha = 100 instead of 360. At 100 the best entry with few numbers sits at about 99.9% fidelity over
# all inputs, the level asked for (at 30 it sits at 99.76%, at 360 it computes nearly everything). What to compare
# with, simulated on 2 million inputs: a rule on two gaps with an exact computation elsewhere scores about 0.54 with
# this agent's exact computation (0.73 of a forward pass) and 0.58 with the team's cheaper one (0.63), and 0.60 with
# a small fitted gate in place of the two thresholds. A reward clearly above 0.60 is new understanding of the
# inputs that are computed today.
#
# Three rounds; the patience is three as well, because the earlier entries, which are over the limit, keep the
# highest reward at this price (about 0.70), so no round here counts as an improvement on them. At most $60.
extends: rnn-g-detail-2.yaml
run_id: pilot-rnn-g-few-numbers
continue_from: pilot-rnn-g-detail-2
rounds_max: 3
patience: 3
continuation:
  alpha: 100
entry:
  max_nodes: 800
  max_const_scalars: 64
