# The pilot on rnn-g: a recurrent network with one layer of 16 units, a ReLU and no biases, reading ten real
# numbers (models/rnn-g), 2,937 operations per forward pass. The agent is told what an input is and how the data
# set is drawn. It is not told what the network was trained to do; finding where its behaviour can be described
# is the work.
# Its inputs are real numbers, infinitely many, so the verifier scores a fresh sample for every submission.
#   rounds on      rnn-g-s0
#   seed check on  rnn-g-s1   the same sizes, another network
# Its baseline is the one of this shape, which the rnn-c pilot is read against too (config/pilot/rnn-f.yaml).
# Everything else is config/pilot/base.yaml and config/defaults.yaml.
extends: base.yaml
run_id: pilot-rnn-g
model: models/rnn-g
network: rnn-g-s0
seed_check: {network: rnn-g-s1}
verifier:
  check: sample
  sample_size: 16384      # per scoring; an entry's build is spread over these
