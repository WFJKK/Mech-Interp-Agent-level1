# The pilot on lin-c: a linear network of the same design as lin-a, trained afresh, asked about inputs of 1 to 4 tokens
# (models/lin-c: 4 slots, 64 tokens, width 8), 671 operations per forward pass. The agent is told what an input is and how the data set is
# drawn. It is not told which inputs the network was trained on, or to do what; finding where its behaviour
# can be described is the work.
# About 17 million inputs, so the verifier scores a fresh sample for every submission.
#   rounds on      lin-c-s0
#   seed check on  lin-c-s1   the same sizes and training, another seed
# Everything else is config/pilot/base.yaml and config/defaults.yaml.
extends: base.yaml
run_id: pilot-lin-c
model: models/lin-c
network: lin-c-s0
seed_check: {network: lin-c-s1}
verifier:
  check: sample
  sample_size: 16384      # per scoring; an entry's build is spread over these
