# A first contact with a real model, kept small on purpose: one round with a short session, to see that the
# login, the tool server, the sandbox and the verifier work together on this machine before the pilot proper
# (config/pilot/lin-a.yaml) is started. Its result is a run like any other, with a lock, a seed check and a
# report, but one short round says little about the network.
extends: lin-a.yaml
run_id: pilot-lin-a-smoke
rounds_max: 1
session:
  python_calls: 8
  submissions: 2
  max_turns: 40
  seconds: 1200
