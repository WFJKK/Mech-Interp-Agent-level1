# The pilot on rnn-c: a recurrent network with one layer of 16 units, a ReLU and no biases, reading ten real
# numbers (models/rnn-c), 2,937 operations per forward pass. The agent is told what an input is and how the data
# set is drawn. It is not told what the network was trained to do; finding where its behaviour can be described
# is the work.
# Its inputs are real numbers, infinitely many, so the verifier scores a fresh sample for every submission.
#   rounds on      rnn-c-s2
#   seed check on  rnn-c-s3   the same sizes and training, another seed (the networks are numbered by their seeds;
#                             the other three are for checking an entry again later)
# Everything else is config/pilot/base.yaml and config/defaults.yaml.
extends: base.yaml
run_id: pilot-rnn-c
model: models/rnn-c
network: rnn-c-s2
seed_check: {network: rnn-c-s3}
verifier:
  check: sample
  sample_size: 16384      # per scoring; an entry's build is spread over these
