# The recurrent network on three real numbers (models/rnn-b, 4 hidden units) studied by a team: a lead that
# decides, each cycle, what each of up to four researchers works on (any task: units of the network, a group
# of inputs, a cheaper program, a check), and that combines their checked results into one program for the
# whole network. The agents are told what an input is and how the data set is drawn, not what the network
# was trained to do.
#   rounds on      rnn-b-s0
#   seed check on  rnn-b-s4   the same sizes and training, another seed
#
# Made to be read against the single-agent run pilot-rnn-b (config/pilot/rnn-b.yaml): the same networks, five
# rounds (here five cycles), patience 2, a fresh sample of 16,384 inputs for every submission, the same
# reward, agent and effort. No baseline agent runs (orchestration.mode: trained).
#
# Allowances are per cycle and shared by the team (level1/multi_agent.py, _allocation). With these numbers
# each of four researchers gets 37 Python calls, 2 submissions, 81 turns, 32 minutes and $5.00 a cycle, and
# the lead 75 calls, 4 submissions, 65 minutes and $10.00; the planning lead $18 and the closing summary
# $20. That is at most $188 for the run, as round_usd caps a cycle at $30. Fewer tasks in a cycle give
# each researcher more. Researchers of earlier team runs spent $2.40 to $4.30 a session when nothing
# stopped them, so $5.00 leaves them their own end.
# A cycle's researchers run side by side, each Python program with up to python.memory_limit_mb of memory.
extends: research.yaml
run_id: team-rnn-b
model: models/rnn-b
network: rnn-b-s0
seed_check: {network: rnn-b-s4}
rounds_max: 5
verifier:
  sample_size: 16384
  workload_size: 16384      # the inputs are real numbers: an entry's build is spread over this many, as in pilot-rnn-b
session:
  python_calls: 250
  submissions: 12
  max_turns: 600
  seconds: 14400
budget:
  run_usd: 200
  round_usd: 30
orchestration:
  mode: trained            # no baseline agent in this run
  development_seed: null   # a fresh sample of 16,384 inputs for every submission, as in pilot-rnn-b
  workers: 4
  initial_regions: []
  initial_tasks:            # only if the lead gives out no tasks
    - task: Find the program for the whole network with the highest reward you can.
