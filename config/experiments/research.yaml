# Shared research profile. An experiment extending this file supplies its model,
# network, run_id and any workload or sampling policy required by that model.
verifier:
  check: auto
session:
  submissions: 6                    # two per worker, two for integration; all are ordinary scored submissions
orchestration:
  enabled: true
  regional_submissions: 2
  checkpoint_python_calls: 2
  final_summary: true
  initial_regions:
    - scope: {kind: all}
      task: Investigate simple computational structure and identify input regions with useful mechanistic explanations; retain strong interpretations even when their mechanisms remain unclear.
    - scope: {kind: all}
      task: Independently test competing mechanistic explanations, exceptions, and computations that several interpretations could share; distinguish supported findings from hypotheses and unresolved questions.
